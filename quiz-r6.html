const questions = [
  {section:'ストラテジ系',q:'問1　マーケティングオートメーション(MA)に関する記述として，最も適切なものはどれか。',options:['企業内に蓄積された大量のデータを分析して，事業戦略などに有効活用する。','小売業やサービス業において，販売した商品単位の情報の収集・蓄積及び分析を行う。','これまで人間が手作業で行っていた定型業務を，AIや機械学習などを取り入れたソフトウェアのロボットが代行することによって自動化や効率化を図る。','見込み顧客の抽出，獲得，育成などの営業活動を効率化する。'],answer:3},
  {section:'ストラテジ系',q:'問2　情報システムに不正に侵入し，サービスを停止させて社会的混乱を生じさせるような行為に対して，国全体で体系的に防御施策を講じるための基本理念を定め，国の責務などを明らかにした法律はどれか。',options:['公益通報者保護法','サイバーセキュリティ基本法','不正アクセス禁止法','情報流通プラットフォーム対処法'],answer:1},
  {section:'ストラテジ系',q:'問3　未来のある時点に目標を設定し，そこを起点に現在を振り返り，目標実現のために現在すべきことを考える方法を表す用語として，最も適切なものはどれか。',options:['PoC(Proof of Concept)','PoV(Proof of Value)','バックキャスティング','フォアキャスティング'],answer:2},
  {section:'ストラテジ系',q:'問4　従来の金融情報システムは堅ろう性が高い一方，柔軟性に欠け，モバイル技術などの情報革新に追従したサービスの迅速な提供が難しかった。これを踏まえて，インターネット関連技術の取込みやそれらを活用するベンチャー企業と組むなどして，新たな価値や革新的なサービスを提供していく潮流を表す用語として，最も適切なものはどれか。',options:['オムニチャネル','フィンテック','ブロックチェーン','ワントゥワンマーケティング'],answer:1},
  {section:'ストラテジ系',q:'問5　ベンチャーキャピタルに関する記述として，最も適切なものはどれか。',options:['新しい技術の獲得や，規模の経済性の追求などを目的に，他の企業と共同出資会社を設立する手法','株式売却による利益獲得などを目的に，新しい製品やサービスを武器に市場に参入しようとする企業に対して出資などを行う企業','新サービスや技術革新などの創出を目的に，国や学術機関，他の企業など外部の組織と共創関係を結び，積極的に技術や資源を交換し，自社に取り込む手法','特定された課題の解決を目的に，一定の期間を定めて企業内に立ち上げられ，構成員を関連部門から招集し，目的が達成された時点で解散する組織'],answer:1},
  {section:'ストラテジ系',q:'問6　技術戦略の策定や技術開発の推進といった技術経営に直接の責任をもつ役職はどれか。',options:['CEO','CFO','COO','CTO'],answer:3},
  {section:'ストラテジ系',q:'問7　システム開発の上流工程において，業務プロセスのモデリングを行う目的として，最も適切なものはどれか。',options:['業務プロセスで取り扱う大量のデータを，統計的手法やAI手法などを用いて分析し，データ間の相関関係や隠れたパターンなどを見いだすため','業務プロセスを可視化することによって，適切なシステム設計のベースとなる情報を整備し，関係者間で解釈を共有できるようにするため','個々の従業員がもっている業務に関する知識・経験やノウハウを社内全体で共有し，創造的なアイディアを生み出すため','プロジェクトに必要な要員を調達し，チームとして組織化して，プロジェクトの目的の達成に向けて一致団結させるため'],answer:1},
  {section:'ストラテジ系',q:'問8　表はA社の期末の損益計算書から抜粋した資料である。当期純利益が800百万円であるとき，販売費及び一般管理費は何百万円か。\n【損益計算書（単位：百万円）】\n売上高：8,000／売上原価：6,000／販売費及び一般管理費：？／営業外収益：150／営業外費用：50／特別利益：60／特別損失：10／法人税等：350',options:['850','900','1,000','1,200'],answer:2},
  {section:'ストラテジ系',q:'問9　企業の戦略立案やマーケティングなどで使用されるフェルミ推定に関する記述として，最も適切なものはどれか。',options:['正確に算出することが極めて難しい数量に対して，把握している情報と論理的な思考プロセスによって概数を求める手法である。','特定の集団と活動を共にしたり，人々の動きを観察したりすることによって，慣習や嗜好，地域や組織を取り巻く文化を類推する手法である。','入力データと出力データから，その因果関係を統計的に推定する手法である。','有識者のグループに繰り返し同一のアンケート調査とその結果のフィードバックを行うことによって，ある分野の将来予測に関する総意を得る手法である。'],answer:0},
  {section:'ストラテジ系',q:'問10　不正競争防止法で規定されている限定提供データに関する記述として，最も適切なものはどれか。',options:['特定の第三者に対し，1回に限定して提供する前提で保管されている技術上又は営業上の情報は限定提供データである。','特定の第三者に提供する情報として電磁的方法によって相当量蓄積され管理されている技術上又は営業上の情報(秘密として管理されているものを除く)は限定提供データである。','特定の第三者に提供するために，金庫などで物理的に管理されている技術上又は営業上の情報は限定提供データである。','不正競争防止法に定めのある営業秘密は限定提供データである。'],answer:1},
  {section:'ストラテジ系',q:'問11　品質に関する組織やプロセスの運営管理を標準化し，マネジメントの質や効率の向上を目的とした方策として，適切なものはどれか。',options:['ISMSの導入','ISO 9001の導入','ITILの導入','プライバシーマークの取得'],answer:1},
  {section:'ストラテジ系',q:'問12　AIに関するガイドラインの一つである"人間中心のAI社会原則"に定められている七つの"AI社会原則"のうち，"イノベーションの原則"に関する記述として，最も適切なものはどれか。',options:['AIの発展によって人も併せて進化するように，国際化や多様化を推進し，大学，研究機関，企業など，官民における連携と，柔軟な人材の移動を促進する。','AIの利用がもたらす結果については，問題の特性に応じて，AIの開発，提供，利用に携わった関係者が分担して責任を負う。','サービスの提供者は，AIを利用している事実やデータの取得方法や使用方法，結果の適切性について，利用者に対する適切な説明を行う。','情報弱者を生み出さないために，幼児教育や初等中等教育において，AI活用や情報リテラシーに関する教育を行う。'],answer:0},
  {section:'ストラテジ系',q:'問13　金融機関では，同一の顧客で複数の口座をもつ個人や法人について，氏名又は法人名，生年月日又は設立年月日，電話番号，住所又は所在地などを手掛かりに集約し，顧客ごとの預金の総額を正確に把握する作業が行われる。このように顧客がもつ複数の口座を，顧客ごとに取りまとめて一元管理する手続を表す用語として，最も適切なものはどれか。',options:['アカウントアグリゲーション','キーマッピング','垂直統合','名寄せ'],answer:3},
  {section:'ストラテジ系',q:'問14　ある商品の販売量と気温の関係が一次式で近似できるとき，予測した気温から商品の販売量を推定する手法として，適切なものはどれか。',options:['回帰分析','線形計画法','デルファイ法','パレート分析'],answer:0},
  {section:'ストラテジ系',q:'問15　必要な時期に必要な量の原材料や部品を調達することによって，工程間の在庫をできるだけもたないようにする生産方式はどれか。',options:['BPO','CIM','JIT','OEM'],answer:2},
  {section:'ストラテジ系',q:'問16　RPAが適用できる業務として，最も適切なものはどれか。',options:['ゲームソフトのベンダーが，ゲームソフトのプログラムを自動で改善する業務','従業員の交通費精算で，交通機関利用区間情報と領収書データから精算伝票を作成する業務','食品加工工場で，産業用ロボットを用いて冷凍食品を自動で製造する業務','通信販売業で，膨大な顧客の購買データから顧客の購買行動に関する新たな法則を見つける業務'],answer:1},
  {section:'ストラテジ系',q:'問17　技術開発戦略において作成されるロードマップを説明しているものはどれか。',options:['技術の競争力レベルと技術のライフサイクルを2軸としたマトリックス上に，自社の技術や新しい技術をプロットする。','研究開発への投資とその成果を2軸とした座標上に，技術の成長過程をグラフ化し，旧技術から新技術への転換状況を表す。','市場面からの有望度と技術面からの有望度を2軸としたマトリックス上に，技術開発プロジェクトをプロットする。','横軸に時間，縦軸に市場，商品，技術などを示し，研究開発成果の商品化，事業化の方向性をそれらの要素間の関係で表す。'],answer:3},
  {section:'ストラテジ系',q:'問18　コーポレートガバナンスを強化した事例として，最も適切なものはどれか。',options:['女性が活躍しやすくするために労務制度を拡充した。','迅速な事業展開のために，他社の事業を買収した。','独立性の高い社外取締役の人数を増やした。','利益が得られにくい事業から撤退した。'],answer:2},
  {section:'ストラテジ系',q:'問19　ある銀行では，システムの接続仕様を外部に公開し，あらかじめ契約を結んだ外部事業者のアクセスを認めることによって，利便性の高い，高度なサービスを展開しやすくしている。このような取組を表す用語として，最も適切なものはどれか。',options:['BPO','RPA','オープンAPI','技術経営'],answer:2},
  {section:'ストラテジ系',q:'問20　A社では，1千万円を投資して営業支援システムを再構築することを検討している。現状の営業支援システムの運用費が5百万円／年，再構築後の営業支援システムの運用費が4百万円／年，再構築による新たな利益の増加が2百万円／年であるとき，この投資の回収期間は何年か。ここで，これら以外の効果，費用などは考慮しないものとし，計算結果は小数点以下第2位を四捨五入するものとする。',options:['2.5','3.3','5.0','10.0'],answer:1},
  {section:'ストラテジ系',q:'問21　あるソフトウェアは，定額の料金や一定の期間での利用ができる形態で提供されている。この利用形態を表す用語として，適切なものはどれか。',options:['アクティベーション','アドウェア','サブスクリプション','ボリュームライセンス'],answer:2},
  {section:'ストラテジ系',q:'問22　インターネットを介して個人や企業が保有する住宅などの遊休資産の貸出しを仲介するサービスや仕組みを表す用語として，最も適切なものはどれか。',options:['シェアードサービス','シェアウェア','シェアリングエコノミー','ワークシェアリング'],answer:2},
  {section:'ストラテジ系',q:'問23　A社はRPAソフトウェアを初めて導入するに当たり，計画策定フェーズ，先行導入フェーズ，本格導入フェーズの3段階で進めようと考えている。次のうち，計画策定フェーズで実施する作業として，適切なものだけを全て挙げたものはどれか。\na　RPAソフトウェアの適用可能性を見極めるための概念検証を実施する。\nb　RPAソフトウェアを全社展開するための導入と運用の手順書を作成する。\nc　部門，業務を絞り込んでRPAソフトウェアを導入し，効果を実測する。',options:['a','a，c','b','b，c'],answer:0},
  {section:'ストラテジ系',q:'問24　式は定期発注方式で原料の発注量を求める計算式である。a～cに入れる字句の適切な組合せはどれか。発注量＝(a＋調達期間)×毎日の使用予定量＋b－現在の在庫量－c',options:['a=営業日数，b=安全在庫量，c=現在の発注残','a=営業日数，b=現在の発注残，c=安全在庫量','a=発注間隔，b=安全在庫量，c=現在の発注残','a=発注間隔，b=現在の発注残，c=安全在庫量'],answer:2},
  {section:'ストラテジ系',q:'問25　史跡などにスマートフォンを向けると，昔あった建物の画像や説明情報を現実の風景と重ねるように表示して，観光案内をできるようにした。ここで活用した仕組みを表す用語として，最も適切なものはどれか。',options:['AR','GUI','VR','メタバース'],answer:0},
  {section:'ストラテジ系',q:'問26　データサイエンティストの役割に関する記述として，最も適切なものはどれか。',options:['機械学習や統計などの手法を用いてビッグデータを解析することによって，ビジネスに活用するための新たな知見を獲得する。','企業が保有する膨大なデータを高速に検索できるように，パフォーマンスの高いデータベースを運用するためのシステム基盤を構築する。','企業における情報システムに関するリスクを評価するために，現場でのデータの取扱いや管理についての実態を調査する。','企業や組織における安全な情報システムの企画，設計，開発，運用を，サイバーセキュリティに関する専門的な知識や技能を活用して支援する。'],answer:0},
  {section:'ストラテジ系',q:'問27　個人情報保護法では，あらかじめ本人の同意を得ていなくても個人データの提供が許される行為を規定している。この行為に該当するものだけを，全て挙げたものはどれか。\na　事故で意識不明の人がもっていた本人の社員証を見て，搬送先の病院が本人の会社に電話してきたので，総務の担当者が本人の自宅電話番号を教えた。\nb　新規加入者を勧誘したいと保険会社の従業員に頼まれたので，総務の担当者が新入社員の名前と所属部門のリストを渡した。\nc　不正送金等の金融犯罪被害者に関する個人情報を，類似犯罪の防止対策を進める捜査機関からの法令に基づく要請に応じて，総務の担当者が提供した。',options:['a','a，c','b，c','c'],answer:1},
  {section:'ストラテジ系',q:'問28　次の事例のうち，AIを導入することによって業務の作業効率が向上したものだけを全て挙げたものはどれか。\na　食品専門商社のA社が，取引先ごとに様式が異なる手書きの請求書に記載された文字を自動で読み取ってデータ化することによって，事務作業時間を削減した。\nb　繊維製造会社のB社が，原材料を取引先に発注する定型的なPCの操作を自動化するツールを導入し，事務部門の人員を削減した。\nc　損害保険会社のC社が，自社のコールセンターへの問合せに対して，オペレーターにつなげる前に音声チャットボットでヒアリングを行うことによって，オペレーターの対応時間を短縮した。\nd　物流会社のD社が，配送荷物に電子タグを装着して出荷時に配送先を電子タグに書き込み，配送時にそれを確認することによって，誤配送を削減した。',options:['a，c','b，c','b，d','c，d'],answer:0},
  {section:'ストラテジ系',q:'問29　ある企業が，顧客を引き付ける優れたUX(User Experience)やビジネスモデルをデジタル技術によって創出し，業界における従来のサービスを駆逐してしまうことによって，その業界の既存の構造が破壊されるような現象を表す用語として，最も適切なものはどれか。',options:['デジタルサイネージ','デジタルディスラプション','デジタルディバイド','デジタルトランスフォーメーション'],answer:1},
  {section:'ストラテジ系',q:'問30　上司から自社の当期の損益計算書を渡され，"我が社の収益性分析をしなさい"と言われた。経営に関する指標のうち，この損益計算書だけから計算できるものだけを全て挙げたものはどれか。\na　売上高増加率\nb　売上高利益率\nc　自己資本利益率',options:['a','a，b','a，b，c','b'],answer:3},
  {section:'ストラテジ系',q:'問31　顧客との個々のつながりを意識して情報を頻繁に更新するSNSなどのシステムとは異なり，会計システムのように高い信頼性と安定稼働が要求される社内情報を扱うシステムの概念を示す用語として，最も適切なものはどれか。',options:['IoT(Internet of Things)','PoC(Proof of Concept)','SOE(Systems of Engagement)','SOR(Systems of Record)'],answer:3},
  {section:'ストラテジ系',q:'問32　労働者派遣における派遣労働者の雇用関係に関する記述のうち，適切なものはどれか。',options:['派遣先との間に雇用関係があり，派遣元との間には存在しない。','派遣元との間に雇用関係があり，派遣先との間には存在しない。','派遣元と派遣先のいずれの間にも雇用関係が存在する。','派遣元と派遣先のいずれの間にも雇用関係は存在しない。'],answer:1},
  {section:'ストラテジ系',q:'問33　次の記述のうち，業務要件定義が曖昧なことが原因で起こり得る問題だけを全て挙げたものはどれか。\na　企画プロセスでシステム化構想がまとまらず，システム化の承認を得られない。\nb　コーディングのミスによって，システムが意図したものと違う動作をする。\nc　システムの開発中に仕様変更による手戻りが頻発する。\nd　システムを受け入れるための適切な受入れテストを設計できない。',options:['a，b','b，c','b，d','c，d'],answer:3},
  {section:'ストラテジ系',q:'問34　顧客の特徴に応じたきめ細かい対応を行うことによって，顧客と長期的に良好な関係を築き，顧客満足度の向上や取引関係の継続につなげる仕組みを構築したい。その仕組みの構成要素の一つとして，営業活動で入手した顧客に関する属性情報や顧客との交渉履歴などを蓄積し，社内で共有できるシステムを導入することにした。この目的を達成できるシステムとして，最も適切なものはどれか。',options:['CAEシステム','MRPシステム','SCMシステム','SFAシステム'],answer:3},
  {section:'ストラテジ系',q:'問35　実用新案に関する記述として，最も適切なものはどれか。',options:['今までにない製造方法は，実用新案の対象となる。','自然法則を利用した技術的思想の創作で高度なものだけが，実用新案の対象となる。','新規性の審査に合格したものだけが実用新案として登録される。','複数の物品を組み合わせて考案した新たな製品は，実用新案の対象となる。'],answer:3},
  {section:'マネジメント系',q:'問36　プロジェクトに該当する事例として，適切なものだけを全て挙げたものはどれか。\na　会社合併に伴う新組織への移行\nb　社内システムの問合せや不具合を受け付けるサービスデスクの運用\nc　新規の経理システム導入に向けたプログラム開発\nd　毎年度末に実施する会計処理',options:['a，c','b，c','b，d','c'],answer:0},
  {section:'マネジメント系',q:'問37　システム開発プロジェクトを終結する時に，プロジェクト統合マネジメントで実施する活動として，最も適切なものはどれか。',options:['工程の進捗の予定と実績の差異を分析する。','作成した全ての成果物の一覧を確認する。','総費用の予算と実績の差異を分析する。','知識や教訓を組織の資産として登録する。'],answer:3},
  {section:'マネジメント系',q:'問38　あるシステムの運用において，利用者との間でSLAを交わし，利用可能日を月曜日から金曜日，1日の利用可能時間を7時から22時まで，稼働率を98%以上で合意した。1週間の運用において，障害などでシステムの停止を許容できる時間は最大何時間か。',options:['0.3','1.5','1.8','2.1'],answer:1},
  {section:'マネジメント系',q:'問39　サービスデスクを評価するためには適切なKPIを定めて評価する必要がある。顧客満足度を高めるために値が小さい方が良いKPIとして，適切なものだけを全て挙げたものはどれか。\na　SLAで合意された目標時間内に対応が完了したインシデント件数の割合\nb　1回の問合せで解決ができたインシデント件数の割合\nc　二次担当へエスカレーションされたインシデント件数の割合\nd　利用者がサービスデスクの担当者につながるまでに費やした時間',options:['a，b','a，d','b，c','c，d'],answer:3},
  {section:'マネジメント系',q:'問40　アジャイル開発に関する記述として，最も適切なものはどれか。',options:['開発する機能を小さい単位に分割して，優先度の高いものから短期間で開発とリリースを繰り返す。','共通フレームを適用して要件定義，設計などの工程名及び作成する文書を定義する。','システム開発を上流工程から下流工程まで順番に進めて，全ての開発工程が終了してからリリースする。','プロトタイプを作成して利用者に確認を求め，利用者の評価とフィードバックを行いながら開発を進めていく。'],answer:0},
  {section:'マネジメント系',q:'問41　あるプロジェクトの作業間の関係と所要時間がアローダイアグラムで示されている。このアローダイアグラムのBからEの四つの結合点のうち，工程全体の完了時間に影響を与えることなく，その結合点から始まる全ての作業の開始を最も遅らせることができるものはどれか。ここで，各結合点から始まる作業はその結合点に至る作業が全て完了するまで開始できず，作業から次の作業への段取り時間は考えないものとする。\n【アローダイアグラム（所要時間）】\nA→B：15，A→C：10，B→D：10，B→E：25，C→E：15，D→E：10，D→F：20，E→F：15',options:['B','C','D','E'],answer:1},
  {section:'マネジメント系',q:'問42　システム監査人の役割として，適切なものだけを全て挙げたものはどれか。\na　監査手続の種類，実施時期，適用範囲などについて，監査計画を立案する。\nb　監査の目的に応じた監査報告書を作成し，社内に公開する。\nc　監査報告書にある改善提案に基づく改善の実施を監査対象部門に指示する。\nd　監査報告書にある改善提案に基づく改善の実施状況をモニタリングする。',options:['a，b','a，d','b，c','c，d'],answer:1},
  {section:'マネジメント系',q:'問43　情報システムに関する施設や設備を維持保全するために行うリスク対策のうち，ファシリティマネジメントの観点から行う対策として，適切なものだけを全て挙げたものはどれか。\na　コンピュータ室への入室を，認可した者だけに限定する。\nb　コンピュータの設置場所を示す標識を掲示しない。\nc　利用者のPCにマルウェア対策ソフトを導入する。',options:['a','a，b','a，c','b，c'],answer:1},
  {section:'マネジメント系',q:'問44　提供しているITシステムが事業のニーズを満たせるように，人材，プロセス，情報技術を適切に組み合わせ，継続的に改善して管理する活動として，最も適切なものはどれか。',options:['ITサービスマネジメント','システム監査','ヒューマンリソースマネジメント','ファシリティマネジメント'],answer:0},
  {section:'マネジメント系',q:'問45　本番稼働後の業務遂行のために，業務別にサービス利用方法の手順を示した文書として，最も適切なものはどれか。',options:['FAQ','サービスレベル合意書','システム要件定義書','利用者マニュアル'],answer:3},
  {section:'マネジメント系',q:'問46　ITサービスマネジメントの管理プロセスに関する記述a～cと用語の適切な組合せはどれか。\na　ITサービスの変更を実装するためのプロセス\nb　インシデントの根本原因を突き止めて解決策を提供するためのプロセス\nc　組織が所有しているIT資産を把握するためのプロセス',options:['a=構成管理，b=問題管理，c=リリース及び展開管理','a=問題管理，b=構成管理，c=リリース及び展開管理','a=構成管理，b=リリース及び展開管理，c=問題管理','a=リリース及び展開管理，b=問題管理，c=構成管理'],answer:3},
  {section:'マネジメント系',q:'問47　ソフトウェアの開発におけるDevOpsに関する記述として，最も適切なものはどれか。',options:['開発側が重要な機能のプロトタイプを作成し，顧客とともにその性能を実測して妥当性を評価する。','開発側では，開発の各工程でその工程の完了を判断した上で次工程に進み，総合テストで利用者が参加して操作性の確認を実施した後に運用側に引き渡す。','開発側と運用側が密接に連携し，自動化ツールなどを活用して機能の導入や更新などを迅速に進める。','システム開発において，機能の拡張を図るために，固定された短期間のサイクルを繰り返しながらプログラムを順次追加する。'],answer:2},
  {section:'マネジメント系',q:'問48　システム監査で用いる判断尺度の選定方法に関する記述として，最も適切なものはどれか。',options:['システム監査ではシステム管理基準の全項目をそのまま使用しなければならない。','システム監査のテーマに応じて，システム管理基準以外の基準を使用してもよい。','システム監査のテーマによらず，システム管理基準以外の基準は使用すべきでない。','アジャイル開発では，システム管理基準は使用すべきでない。'],answer:1},
  {section:'マネジメント系',q:'問49　ソフトウェア開発プロジェクトにおける，コスト見積手法である積み上げ法，ファンクションポイント法，類推見積法と，それぞれの特徴の適切な組合せはどれか。\na　プロジェクトに必要な個々の作業を洗い出し，その作業ごとの工数を見積もって集計する。\nb　プロジェクトの初期段階で使用する手法で，過去の事例を活用してコストを見積もる。\nc　データ入出力や機能に着目して，ソフトウェア規模を見積もり，係数を乗ずるなどしてコストを見積もる。',options:['積み上げ法-a，ファンクションポイント法-c，類推見積法-b','積み上げ法-b，ファンクションポイント法-a，類推見積法-c','積み上げ法-c，ファンクションポイント法-a，類推見積法-b','積み上げ法-c，ファンクションポイント法-b，類推見積法-a'],answer:0},
  {section:'マネジメント系',q:'問50　ソフトウェア製品の品質特性を，移植性，機能適合性，互換性，使用性，信頼性，性能効率性，セキュリティ，保守性に分類したとき，RPAソフトウェアの使用性に関する記述として，最も適切なものはどれか。',options:['RPAが稼働するPCのOSが変わっても動作する。','RPAで指定した時間及び条件に基づき，適切に自動処理が実行される。','RPAで操作対象となるアプリケーションソフトウェアがバージョンアップされても，簡単な設定変更で対応できる。','RPAを利用したことがない人でも，簡単な教育だけで利用可能になる。'],answer:3},
  {section:'マネジメント系',q:'問51　システム開発プロジェクトにおいて，テスト中に発見された不具合の再発防止のために不具合分析を行うことにした。テスト結果及び不具合の内容を表に記入し，不具合ごとに根本原因を突き止めた後に，根本原因ごとに集計を行い発生頻度の多い順に並べ，主要な根本原因の特定を行った。ここで利用した図表のうち，根本原因を集計し，発生頻度順に並べて棒グラフで示し，累積値を折れ線グラフで重ねて示したものはどれか。',options:['散布図','チェックシート','特性要因図','パレート図'],answer:3},
  {section:'マネジメント系',q:'問52　システム開発プロジェクトにおいて，新機能の追加要求が変更管理委員会で認可された後にプロジェクトスコープマネジメントで実施する活動として，適切なものはどれか。',options:['新機能を追加で開発するためにWBSを変更し，コストの詳細な見積りをするための情報として提供する。','新機能を追加で開発するためのWBSのアクティビティの実行に必要なスキルを確認し，必要に応じてプロジェクトチームの能力向上を図る。','変更されたWBSに基づいてスケジュールを作成し，完了時期の見通しを提示する。','変更されたWBSに基づいて要員の充足度を確認し，必要な場合は作業の外注を検討する。'],answer:0},
  {section:'マネジメント系',q:'問53　経営者は，aの事業の目的を支援する観点で，効果的，効率的かつ受容可能なaのITの利用について評価する。',options:['過去と現在','現在','現在と将来','将来'],answer:2},
  {section:'マネジメント系',q:'問54　事業活動に関わる法令の遵守などを目的の一つとして，統制環境，リスクの評価と対応，統制活動，情報と伝達，モニタリング，ITへの対応から構成される取組はどれか。',options:['CMMI','ITIL','内部統制','ERM'],answer:2},
  {section:'マネジメント系',q:'問55　システム監査の目的に関する記述として，適切なものはどれか。',options:['開発すべきシステムの具体的な用途を分析し，システム要件を明らかにすること','情報システムが設置されている施設とその環境を総合的に企画，管理，活用すること','情報システムに係るリスクに適切に対応しているかどうかを評価することによって，組織体の目標達成に寄与すること','知識，スキル，ツール及び技法をプロジェクト活動に適用することによってプロジェクトの要求事項を満足させること'],answer:2},
  {section:'テクノロジ系',q:'問56　PCにおいて，電力供給を断つと記憶内容が失われるメモリ又は記憶媒体はどれか。',options:['DVD-RAM','DRAM','ROM','フラッシュメモリ'],answer:1},
  {section:'テクノロジ系',q:'問57　暗号化方式の特徴について記した表において，表中のa～dに入れる字句の適切な組合せはどれか。\n【表】暗号方式[a]：鍵の特徴「暗号化鍵と復号鍵が異なる」，鍵の安全な配布「容易」，処理速度[c]　暗号方式[b]：鍵の特徴「暗号化鍵と復号鍵が同一」，鍵の安全な配布「難しい」，処理速度[d]',options:['a=共通鍵暗号方式，b=公開鍵暗号方式，c=速い，d=遅い','a=共通鍵暗号方式，b=公開鍵暗号方式，c=遅い，d=速い','a=公開鍵暗号方式，b=共通鍵暗号方式，c=遅い，d=速い','a=公開鍵暗号方式，b=共通鍵暗号方式，c=速い，d=遅い'],answer:2},
  {section:'テクノロジ系',q:'問58　文書作成ソフトや表計算ソフトなどにおいて，一連の操作手順をあらかじめ定義しておき，実行する機能はどれか。',options:['オートコンプリート','ソースコード','プラグアンドプレイ','マクロ'],answer:3},

  {section:'テクノロジ系',q:'問97　次のOSのうち，OSS(Open Source Software)として提供されるものだけを全て挙げたものはどれか。\na　Android\nb　FreeBSD\nc　iOS\nd　Linux',options:['a，b','a，b，d','b，d','c，d'],answer:1},
  {section:'テクノロジ系',q:'問98　ランサムウェアに関する記述として，最も適切なものはどれか。',options:['PCに外部から不正にログインするための侵入路をひそかに設置する。','PCのファイルを勝手に暗号化し，復号のためのキーを提供することなどを条件に金銭を要求する。','Webブラウザを乗っ取り，オンラインバンキングなどの通信に割り込んで不正送金などを行う。','自らネットワークを経由して感染を広げる機能をもち，まん延していく。'],answer:1},
  {section:'テクノロジ系',q:'問99　GPSの電波を捕捉しにくいビルの谷間や狭い路地などでも位置を計測することができるように，特定の地域の上空に比較的長く留まる軌道をとり，GPSと併用することによって，より高い測位精度を実現するものはどれか。',options:['アシストGPS','ジャイロセンサー','準天頂衛星','プローブカー'],answer:2},
  {section:'テクノロジ系',q:'問100　正しいURLを指定してインターネット上のWebサイトへアクセスしようとした利用者が，偽装されたWebサイトに接続されてしまうようになった。原因を調べたところ，ドメイン名とIPアドレスの対応付けを管理するサーバに脆弱性があり，攻撃者によって，ドメイン名とIPアドレスを対応付ける情報が書き換えられていた。このサーバが受けた攻撃はどれか。',options:['DDoS攻撃','DNSキャッシュポイズニング','ソーシャルエンジニアリング','ドライブバイダウンロード'],answer:1},
];

let current = 0;
let score = 0;
let currentShuffledCorrect = 0;
let answered = [];
const labels = ['ア','イ','ウ','エ'];

function updateProgress() {
  var pct = (current / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = (current + 1) + ' / ' + questions.length;
}

function showQuestion() {
  if (current >= questions.length) { showScore(); return; }
  updateProgress();
  var q = questions[current];
  var area = document.getElementById('quizArea');

  // セクションバッジ
  var badge = document.createElement('div');
  badge.className = 'section-badge';
  badge.textContent = q.section;

  // カード
  var card = document.createElement('div');
  card.className = 'question-card';

  var num = document.createElement('div');
  num.className = 'question-num';
  num.textContent = '問 ' + (current + 1) + ' / ' + questions.length;

  var qtext = document.createElement('div');
  qtext.className = 'question-text';
  qtext.innerHTML = q.q.replace(/\n/g, '<br>');

  card.appendChild(num);
  card.appendChild(qtext);

  if (q.note) {
    var note = document.createElement('div');
    note.className = 'note';
    note.textContent = '💡 ' + q.note;
    card.appendChild(note);
  }

  var opts = document.createElement('div');
  opts.className = 'options';
  opts.id = 'optionsDiv';

  // Shuffle options (Fisher-Yates)
  var shuffledIndices = q.options.map(function(_, i) { return i; });
  for (var si = shuffledIndices.length - 1; si > 0; si--) {
    var sj = Math.floor(Math.random() * (si + 1));
    var stmp = shuffledIndices[si]; shuffledIndices[si] = shuffledIndices[sj]; shuffledIndices[sj] = stmp;
  }
  currentShuffledCorrect = shuffledIndices.indexOf(q.answer);

  shuffledIndices.forEach(function(origIdx, displayIdx) {
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.type = 'button';
    btn.innerHTML = '<strong>' + labels[displayIdx] + '</strong>　' + q.options[origIdx];
    btn.dataset.idx = displayIdx;
    opts.appendChild(btn);
  });

  var fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'feedback';

  card.appendChild(opts);
  card.appendChild(fb);

  // ナビ
  var nav = document.createElement('div');
  nav.className = 'nav';

  var scoreSpan = document.createElement('span');
  scoreSpan.style.cssText = 'color:#888;font-size:0.85em;';
  scoreSpan.textContent = '正解数: ' + score + ' / ' + current;

  var nextBtn = document.createElement('button');
  nextBtn.className = 'btn';
  nextBtn.id = 'nextBtn';
  nextBtn.type = 'button';
  nextBtn.textContent = '次の問題 →';
  nextBtn.style.display = 'none';

  nav.appendChild(scoreSpan);
  nav.appendChild(nextBtn);

  area.innerHTML = '';
  area.appendChild(badge);
  area.appendChild(card);
  area.appendChild(nav);

  // イベント委任（タッチ/クリック両対応）
  opts.addEventListener('click', function(e) {
    var btn = e.target.closest('.option-btn');
    if (!btn || btn.disabled) return;
    selectAnswer(parseInt(btn.dataset.idx, 10));
  });

  nextBtn.addEventListener('click', function() {
    current++;
    showQuestion();
  });

  // スクロール先頭へ
  window.scrollTo(0, 0);
}

function selectAnswer(idx) {
  var q = questions[current];
  var btns = document.querySelectorAll('.option-btn');
  btns.forEach(function(b) { b.disabled = true; });
  var fb = document.getElementById('feedback');
  if (idx === currentShuffledCorrect) {
    btns[idx].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　正解は ' + labels[currentShuffledCorrect] + ' です。';
    score++;
  } else {
    btns[idx].classList.add('wrong');
    btns[currentShuffledCorrect].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。正解は ' + labels[currentShuffledCorrect] + '：「' + q.options[q.answer] + '」';
  }
  fb.style.display = 'block';
  answered.push(idx === currentShuffledCorrect);
  document.getElementById('nextBtn').style.display = 'block';
}

function showScore() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = '完了！';
  var pct = Math.round(score / questions.length * 100);
  var msg = pct >= 80 ? '合格ライン突破！素晴らしい！' : pct >= 60 ? 'もう少しで合格圏内！頑張ろう！' : 'もっと練習が必要です。復習しましょう！';
  var sScore = 0, mScore = 0, tScore = 0;
  for (var i = 0; i < 35; i++) if (answered[i]) sScore++;
  for (var i = 35; i < 55; i++) if (answered[i]) mScore++;
  for (var i = 55; i < 100; i++) if (answered[i]) tScore++;

  var area = document.getElementById('quizArea');
  area.innerHTML = '';
  var scoreArea = document.getElementById('scoreArea');
  scoreArea.className = '';
  scoreArea.innerHTML =
    '<div class="score-card">' +
    '<div class="score-num">' + score + '<span style="font-size:0.4em;color:#555"> / ' + questions.length + '</span></div>' +
    '<div class="score-label" style="font-size:1.1em;font-weight:bold;margin-top:8px;">' + pct + '点</div>' +
    '<div class="score-label">' + msg + '</div>' +
    '<div class="score-detail">' +
    'ストラテジ系（問1〜35）：' + sScore + ' / 35 点<br>' +
    'マネジメント系（問36〜55）：' + mScore + ' / 20 点<br>' +
    'テクノロジ系（問56〜100）：' + tScore + ' / 45 点' +
    '</div>' +
    '<button class="btn" id="retryBtn" type="button" style="margin-top:24px;width:100%;">もう一度挑戦する</button>' +
    '</div>';

  document.getElementById('retryBtn').addEventListener('click', function() {
    location.reload();
  });
  window.scrollTo(0, 0);
}

showQuestion();
</script>

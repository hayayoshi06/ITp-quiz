    section: "テクノロジ系",
    q: "問99　IoT デバイスと IoT サーバで構成され，IoT デバイスが計測した外気温を IoT サーバへ送り，IoT サーバからの指示で IoT デバイスに搭載されたモータが窓を開閉するシステムがある。このシステムにおけるアクチュエータの役割として，適切なものはどれか。",
    options: [
      "IoT デバイスから送られてくる外気温のデータを受信する。",
      "IoT デバイスに対して窓の開閉指示を送信する。",
      "外気温を電気信号に変換する。",
      "窓を開閉する。"
    ],
    answer: 3
  },
  {
    section: "テクノロジ系",
    q: "問100　電子メールにディジタル署名を付与して送信するとき，信頼できる認証局から発行された電子証明書を使用することに比べて，送信者が自分で作成した電子証明書を使用した場合の受信側のリスクとして，適切なものはどれか。",
    options: [
      "電子メールが正しい相手から送られてきたかどうかが確認できなくなる。",
      "電子メールが途中で盗み見られている危険性が高まる。",
      "電子メールが途中で紛失する危険性が高まる。",
      "電子メールに文字化けが途中で発生しやすくなる。"
    ],
    answer: 0
  }
];

let current = 0;
let score = 0;
let currentShuffledCorrect = 0;
let answered = [];
const labels = ['ア','イ','ウ','エ'];

function updateProgress() {
  var pct = (current / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = (current + 1) + ' / ' + questions.length;
}

function showQuestion() {
  if (current >= questions.length) { showScore(); return; }
  updateProgress();
  var q = questions[current];
  var area = document.getElementById('quizArea');

  var badge = document.createElement('div');
  badge.className = 'section-badge';
  badge.textContent = q.section;

  var card = document.createElement('div');
  card.className = 'question-card';

  var num = document.createElement('div');
  num.className = 'question-num';
  num.textContent = '問 ' + (current + 1) + ' / ' + questions.length;

  var qtext = document.createElement('div');
  qtext.className = 'question-text';
  qtext.innerHTML = q.q.replace(/\n/g, '<br>');

  card.appendChild(num);
  card.appendChild(qtext);

  if (q.note) {
    var note = document.createElement('div');
    note.className = 'note';
    note.textContent = '💡 ' + q.note;
    card.appendChild(note);
  }

  var opts = document.createElement('div');
  opts.className = 'options';
  opts.id = 'optionsDiv';

  // Shuffle options (Fisher-Yates)
  var shuffledIndices = q.options.map(function(_, i) { return i; });
  for (var si = shuffledIndices.length - 1; si > 0; si--) {
    var sj = Math.floor(Math.random() * (si + 1));
    var stmp = shuffledIndices[si]; shuffledIndices[si] = shuffledIndices[sj]; shuffledIndices[sj] = stmp;
  }
  currentShuffledCorrect = shuffledIndices.indexOf(q.answer);

  shuffledIndices.forEach(function(origIdx, displayIdx) {
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.type = 'button';
    btn.innerHTML = '<strong>' + labels[displayIdx] + '</strong>　' + q.options[origIdx];
    btn.dataset.idx = displayIdx;
    opts.appendChild(btn);
  });

  var fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'feedback';

  card.appendChild(opts);
  card.appendChild(fb);

  var nav = document.createElement('div');
  nav.className = 'nav';

  var scoreSpan = document.createElement('span');
  scoreSpan.style.cssText = 'color:#888;font-size:0.85em;';
  scoreSpan.textContent = '正解数: ' + score + ' / ' + current;

  var nextBtn = document.createElement('button');
  nextBtn.className = 'btn';
  nextBtn.id = 'nextBtn';
  nextBtn.type = 'button';
  nextBtn.textContent = '次の問題 →';
  nextBtn.style.display = 'none';

  nav.appendChild(scoreSpan);
  nav.appendChild(nextBtn);

  area.innerHTML = '';
  area.appendChild(badge);
  area.appendChild(card);
  area.appendChild(nav);

  opts.addEventListener('click', function(e) {
    var btn = e.target.closest('.option-btn');
    if (!btn || btn.disabled) return;
    selectAnswer(parseInt(btn.dataset.idx, 10));
  });

  nextBtn.addEventListener('click', function() {
    current++;
    showQuestion();
  });

  window.scrollTo(0, 0);
}

function selectAnswer(idx) {
  var q = questions[current];
  var btns = document.querySelectorAll('.option-btn');
  btns.forEach(function(b) { b.disabled = true; });
  var fb = document.getElementById('feedback');
  if (idx === currentShuffledCorrect) {
    btns[idx].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　正解は ' + labels[currentShuffledCorrect] + ' です。';
    score++;
  } else {
    btns[idx].classList.add('wrong');
    btns[currentShuffledCorrect].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。正解は ' + labels[currentShuffledCorrect] + '：「' + q.options[q.answer] + '」';
  }
  fb.style.display = 'block';
  answered.push(idx === currentShuffledCorrect);
  document.getElementById('nextBtn').style.display = 'block';
}

function showScore() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = '完了！';
  var pct = Math.round(score / questions.length * 100);
  var msg = pct >= 80 ? '合格ライン突破！素晴らしい！' : pct >= 60 ? 'もう少しで合格圏内！頑張ろう！' : 'もっと練習が必要です。復習しましょう！';
  var sScore = 0, mScore = 0, tScore = 0;
  for (var i = 0; i < 35; i++) if (answered[i]) sScore++;
  for (var i = 35; i < 55; i++) if (answered[i]) mScore++;
  for (var i = 55; i < 100; i++) if (answered[i]) tScore++;

  var area = document.getElementById('quizArea');
  area.innerHTML = '';
  var scoreArea = document.getElementById('scoreArea');
  scoreArea.className = '';
  scoreArea.innerHTML =
    '<div class="score-card">' +
    '<div class="score-num">' + score + '<span style="font-size:0.4em;color:#555"> / ' + questions.length + '</span></div>' +
    '<div class="score-label" style="font-size:1.1em;font-weight:bold;margin-top:8px;">' + pct + '点</div>' +
    '<div class="score-label">' + msg + '</div>' +
    '<div class="score-detail">' +
    'ストラテジ系（問1〜35）：' + sScore + ' / 35<br>' +
    'マネジメント系（問36〜55）：' + mScore + ' / 20<br>' +
    'テクノロジ系（問56〜100）：' + tScore + ' / 45' +
    '</div>' +
    '<button class="btn" style="margin-top:20px;" onclick="restart()">もう一度チャレンジ</button>' +
    '</div>';
}

function restart() {
  current = 0;
  score = 0;
  answered = [];
  document.getElementById('scoreArea').className = 'hidden';
  showQuestion();
}

showQuestion();
</script>

</html>

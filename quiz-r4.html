      "入力データから固定長のハッシュ値を生成し，元のデータの復元は困難であるという一方向性がある。"
    ],
    answer: 3
  },
  {
    section: "テクノロジ系",
    q: "問98　電子署名の目的として，最も適切なものはどれか。",
    options: [
      "データを暗号化して，第三者による盗聴を防止する。",
      "送信者の本人確認（認証）とデータの改ざん検知を実現する。",
      "データの転送速度を向上させる。",
      "データをバックアップして，消失を防止する。"
    ],
    answer: 1
  },
  {
    section: "テクノロジ系",
    q: "問99　Webブラウザに関する説明として，最も適切なものはどれか。",
    options: [
      "WebページのHTMLやCSS，JavaScriptを解釈・描画し，ユーザがWebサイトを閲覧・操作するためのソフトウェアである。",
      "Webサーバからのリクエストを受け付け，Webページを配信するソフトウェアである。",
      "インターネット上のWebサイトを収集・索引化するソフトウェアである。",
      "電子メールの送受信を管理するソフトウェアである。"
    ],
    answer: 0
  },
  {
    section: "テクノロジ系",
    q: "問100　サイバーセキュリティ基本法に関する記述として，最も適切なものはどれか。",
    options: [
      "サイバーセキュリティに関する施策を総合的かつ効率的に推進するために，国，地方公共団体，重要インフラ事業者などの責務を規定した法律である。",
      "不正アクセス行為を禁止し，刑事罰を規定した法律である。",
      "個人情報の適切な取り扱いを定めた法律である。",
      "電子商取引における消費者保護を規定した法律である。"
    ],
    answer: 2
  }
];

let current = 0;
let score = 0;
let answered = [];
const labels = ['ア','イ','ウ','エ'];

function updateProgress() {
  var pct = (current / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = (current + 1) + ' / ' + questions.length;
}

function showQuestion() {
  if (current >= questions.length) { showScore(); return; }
  updateProgress();
  var q = questions[current];
  var area = document.getElementById('quizArea');

  // セクションバッジ
  var badge = document.createElement('div');
  badge.className = 'section-badge';
  badge.textContent = q.section;

  // カード
  var card = document.createElement('div');
  card.className = 'question-card';

  var num = document.createElement('div');
  num.className = 'question-num';
  num.textContent = '問 ' + (current + 1) + ' / ' + questions.length;

  var qtext = document.createElement('div');
  qtext.className = 'question-text';
  qtext.innerHTML = q.q.replace(/\n/g, '<br>');

  card.appendChild(num);
  card.appendChild(qtext);

  if (q.note) {
    var note = document.createElement('div');
    note.className = 'note';
    note.textContent = '💡 ' + q.note;
    card.appendChild(note);
  }

  var opts = document.createElement('div');
  opts.className = 'options';
  opts.id = 'optionsDiv';

  q.options.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.type = 'button';
    btn.innerHTML = '<strong>' + labels[i] + '</strong>　' + opt;
    btn.dataset.idx = i;
    opts.appendChild(btn);
  });

  var fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'feedback';

  card.appendChild(opts);
  card.appendChild(fb);

  // ナビ
  var nav = document.createElement('div');
  nav.className = 'nav';

  var scoreSpan = document.createElement('span');
  scoreSpan.style.cssText = 'color:#888;font-size:0.85em;';
  scoreSpan.textContent = '正解数: ' + score + ' / ' + current;

  var nextBtn = document.createElement('button');
  nextBtn.className = 'btn';
  nextBtn.id = 'nextBtn';
  nextBtn.type = 'button';
  nextBtn.textContent = '次の問題 →';
  nextBtn.style.display = 'none';

  nav.appendChild(scoreSpan);
  nav.appendChild(nextBtn);

  area.innerHTML = '';
  area.appendChild(badge);
  area.appendChild(card);
  area.appendChild(nav);

  // イベント委任（タッチ/クリック両対応）
  opts.addEventListener('click', function(e) {
    var btn = e.target.closest('.option-btn');
    if (!btn || btn.disabled) return;
    selectAnswer(parseInt(btn.dataset.idx, 10));
  });

  nextBtn.addEventListener('click', function() {
    current++;
    showQuestion();
  });

  // スクロール先頭へ
  window.scrollTo(0, 0);
}

function selectAnswer(idx) {
  var q = questions[current];
  var btns = document.querySelectorAll('.option-btn');
  btns.forEach(function(b) { b.disabled = true; });
  var fb = document.getElementById('feedback');
  if (idx === q.answer) {
    btns[idx].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　正解は ' + labels[q.answer] + ' です。';
    score++;
  } else {
    btns[idx].classList.add('wrong');
    btns[q.answer].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。正解は ' + labels[q.answer] + '：「' + q.options[q.answer] + '」';
  }
  fb.style.display = 'block';
  answered.push(idx === q.answer);
  document.getElementById('nextBtn').style.display = 'block';
}

function showScore() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = '完了！';
  var pct = Math.round(score / questions.length * 100);
  var msg = pct >= 80 ? '合格ライン突破！素晴らしい！' : pct >= 60 ? 'もう少しで合格圏内！頑張ろう！' : 'もっと練習が必要です。復習しましょう！';
  var sScore = 0, mScore = 0, tScore = 0;
  for (var i = 0; i < 35; i++) if (answered[i]) sScore++;
  for (var i = 35; i < 55; i++) if (answered[i]) mScore++;
  for (var i = 55; i < 100; i++) if (answered[i]) tScore++;

  var area = document.getElementById('quizArea');
  area.innerHTML = '';
  var scoreArea = document.getElementById('scoreArea');
  scoreArea.className = '';
  scoreArea.innerHTML =
    '<div class="score-card">' +
    '<div class="score-num">' + score + '<span style="font-size:0.4em;color:#555"> / ' + questions.length + '</span></div>' +
    '<div class="score-label" style="font-size:1.1em;font-weight:bold;margin-top:8px;">' + pct + '点</div>' +
    '<div class="score-label">' + msg + '</div>' +
    '<div class="score-detail">' +
    'ストラテジ系（問1〜35）：' + sScore + ' / 35 点<br>' +
    'マネジメント系（問36〜55）：' + mScore + ' / 20 点<br>' +
    'テクノロジ系（問56〜100）：' + tScore + ' / 45 点' +
    '</div>' +
    '<button class="btn" id="retryBtn" type="button" style="margin-top:24px;width:100%;">もう一度挑戦する</button>' +
    '</div>';

  document.getElementById('retryBtn').addEventListener('click', function() {
    location.reload();
  });
  window.scrollTo(0, 0);
}

showQuestion();
</script>
</body>
</html>

  {section:'マネジメント系',q:'問47　ソフトウェア保守に関する記述のうち，適切なものはどれか。',options:['ア　本番環境で運用中のシステムに対して，ソフトウェアの潜在不良を発見し，障害が発生する前に修正を行うことはソフトウェア保守には含まれない。','イ　本番環境で運用中のシステムに対して，ソフトウェアの不具合を修正することがソフトウェア保守であり，仕様変更に伴う修正はソフトウェア保守には含まれない。','ウ　本番環境で運用中のシステムに対して，法律改正に伴うソフトウェア修正もソフトウェア保守に含まれる。','エ　本番環境で運用中のシステムに対する修正だけでなく，納入前のシステム開発期間中に実施した不具合の修正もソフトウェア保守に含まれる。'],answer:2},

  {section:'テクノロジ系',q:'問68　無線LANルータにおいて，外部から持ち込まれた端末用に設けられた，「ゲストポート」や「ゲストSSID」などと呼ばれる機能によって実現できることの説明として，適切なものはどれか。',options:['ア　端末から内部ネットワークには接続をさせず，インターネットにだけ接続する。','イ　端末がマルウェアに感染していないかどうかを検査し，安全が確認された端末だけを接続する。','ウ　端末と無線LANルータのボタン操作だけで，端末から無線LANルータへの接続設定ができる。','エ　端末のSSIDの設定欄を空欄にしておけば，SSIDが分からなくても無線LANルータに接続できる。'],answer:0},

  {section:'テクノロジ系',q:'問72　情報セキュリティにおける機密性，完全性及び可用性と，①〜③のインシデントによって損なわれたものとの組合せとして，適切なものはどれか。\n①DDoS攻撃によって，Webサイトがダウンした。\n②キーボードの打ち間違いによって，不正確なデータが入力された。\n③PCがマルウェアに感染したことによって，個人情報が漏えいした。',options:['ア　①：可用性，②：完全性，③：機密性','イ　①：可用性，②：機密性，③：完全性','ウ　①：完全性，②：可用性，③：機密性','エ　①：完全性，②：機密性，③：可用性'],answer:0},

  {section:'テクノロジ系',q:'問82　A社では，従業員の利用者IDとパスワードを用いて社内システムの利用者認証を行っている。セキュリティを強化するために，このシステムに新たな認証機能を一つ追加することにした。認証機能a〜cのうち，このシステムに追加することによって，二要素認証になる機能だけを全て挙げたものはどれか。\na　A社の従業員証として本人に支給しているICカードを読み取る認証\nb　あらかじめシステムに登録しておいた本人しか知らない秘密の質問に対する答えを入力させる認証\nc　あらかじめシステムに登録しておいた本人の顔の特徴と，認証時にカメラで読み取った顔の特徴を照合する認証',options:['ア　a','イ　a，b，c','ウ　a，c','エ　b，c'],answer:2},

  var q = questions[current];
  var isAnswered = answers[current] !== null;
  var pct = (current / questions.length * 100).toFixed(1);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = (current + 1) + ' / ' + questions.length;

  var html = '<div class="section-badge">' + q.section + '　' + getSectionRange(q.section) + '</div>';
  html += '<div class="question-card">';
  html += '<div class="question-num">第' + (current + 1) + '問</div>';
  html += '<div class="question-text">' + q.q.replace(/\n/g, '<br>') + '</div>';
  html += '<div class="options">';

  if (!shuffledOrders[current]) {
    var order = q.options.map(function(_, k) { return k; });
    for (var si = order.length - 1; si > 0; si--) {
      var sj = Math.floor(Math.random() * (si + 1));
      var stmp = order[si]; order[si] = order[sj]; order[sj] = stmp;
    }
    shuffledOrders[current] = order;
  }
  var order = shuffledOrders[current];
  for (var i = 0; i < q.options.length; i++) {
    var origIdx = order[i];
    var cls = 'option-btn';
    if (isAnswered) {
      if (origIdx === q.answer) cls += ' reveal';
      else if (origIdx === answers[current] && answers[current] !== q.answer) cls += ' wrong';
    }
    var disabled = isAnswered ? 'disabled' : '';
    var optText = q.options[origIdx].replace(/^[アイウエ]　/, '');
    html += '<button class="' + cls + '" ' + disabled + ' onclick="selectAnswer(' + i + ')">' + labels[i] + '　' + optText + '</button>';
  }

  html += '</div>';

  if (isAnswered) {
    var correct = answers[current] === q.answer;
    html += '<div class="feedback ' + (correct ? 'correct' : 'wrong') + '" style="display:block">';
    html += correct ? '正解です！' : '不正解。正解は「' + q.options[q.answer] + '」です。';
    html += '</div>';
  }

  html += '</div>';

  html += '<div class="nav">';
  if (current > 0) {
    html += '<button class="btn btn-secondary" onclick="prevQuestion()">← 前の問題</button>';
  } else {
    html += '<span></span>';
  }
  if (isAnswered) {
    if (current < questions.length - 1) {
      html += '<button class="btn" onclick="nextQuestion()">次の問題 →</button>';
    } else {
      html += '<button class="btn" onclick="showScore()">結果を見る</button>';
    }
  } else {
    html += '<span></span>';
  }
  html += '</div>';

  document.getElementById('quizArea').innerHTML = html;
  window.scrollTo(0, 0);
}

function selectAnswer(idx) {
  if (answers[current] !== null) return;
  var origIdx = shuffledOrders[current][idx];
  answers[current] = origIdx;
  if (origIdx === questions[current].answer) score++;
  render();
}

function nextQuestion() {
  if (current < questions.length - 1) {
    current++;
    render();
  }
}

function prevQuestion() {
  if (current > 0) {
    current--;
    render();
  }
}

function showScore() {
  document.getElementById('quizArea').classList.add('hidden');
  var s = score;
  var t = questions.length;
  var pct = Math.round(s / t * 100);

  var strat = 0, stratT = 0, mgmt = 0, mgmtT = 0, tech = 0, techT = 0;
  for (var i = 0; i < questions.length; i++) {
    var sec = questions[i].section;
    if (sec === 'ストラテジ系') { stratT++; if (answers[i] === questions[i].answer) strat++; }
    else if (sec === 'マネジメント系') { mgmtT++; if (answers[i] === questions[i].answer) mgmt++; }
    else { techT++; if (answers[i] === questions[i].answer) tech++; }
  }

  var html = '<div class="score-card">';
  html += '<div class="score-num">' + s + '<span style="font-size:0.5em;color:#555"> / ' + t + '</span></div>';
  html += '<div class="score-label">正解率 ' + pct + '%</div>';
  html += '<div class="score-detail">';
  html += 'ストラテジ系：' + strat + ' / ' + stratT + '<br>';
  html += 'マネジメント系：' + mgmt + ' / ' + mgmtT + '<br>';
  html += 'テクノロジ系：' + tech + ' / ' + techT;
  html += '</div>';
  html += '<br><button class="btn" onclick="location.reload()">もう一度</button>';
  html += '&nbsp;&nbsp;<button class="btn btn-secondary" onclick="location.href=\'index.html\'">トップへ</button>';
  html += '</div>';
  document.getElementById('scoreArea').innerHTML = html;
  document.getElementById('scoreArea').classList.remove('hidden');
  window.scrollTo(0, 0);
}

render();
</script>
</body>
</html>

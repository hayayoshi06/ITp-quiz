const questions = [
  {section:'ストラテジ系',q:'問1　E-R図を使用してデータモデリングを行う理由として、適切なものはどれか。',options:['ア　業務上でのデータのやり取りを把握し、ワークフローを明らかにする。','イ　現行業務でのデータの流れを把握し、業務遂行上の問題点を明らかにする。','ウ　顧客や製品といった業務の管理対象間の関係を図示し、その業務上の意味を明らかにする。','エ　データ項目を詳細に検討し、データベースの実装方法を明らかにする。'],answer:2},
  {section:'ストラテジ系',q:'問2　国際標準化機関に関する記述のうち、適切なものはどれか。',options:['ア　ICANNは、工業や科学技術分野の国際標準化機関である。','イ　IECは、電子商取引分野の国際標準化機関である。','ウ　IEEEは、会計分野の国際標準化機関である。','エ　ITUは、電気通信分野の国際標準化機関である。'],answer:3},
  {section:'ストラテジ系',q:'問3　人間の脳神経の仕組みをモデルにして、コンピュータプログラムで模したものを表す用語はどれか。',options:['ア　ソーシャルネットワーク','イ　デジタルトランスフォーメーション','ウ　ニューラルネットワーク','エ　ブレーンストーミング'],answer:2},
  {section:'ストラテジ系',q:'問4　エンタープライズサーチの説明として、最も適切なものはどれか。',options:['ア　企業内の様々なシステムに蓄積されている定型又は非定型なデータを、一元的に検索するための仕組み','イ　自然言語処理を実現するための基礎データとなる、電子化された大量の例文データベース','ウ　写真や書類などを光学的に読み取り、ディジタルデータ化するための画像入力装置','エ　情報システムや業務プロセスの現状を把握し、あるべき企業の姿とのギャップを埋めるための目標を設定し、全体最適化を図ること'],answer:0},
  {section:'ストラテジ系',q:'問5　クラウドコンピューティングの説明として、最も適切なものはどれか。',options:['ア　システム全体を管理する大型汎用機などのコンピュータに、データを一極集中させて処理すること','イ　情報システム部門以外の人が自らコンピュータを操作し、自分や自部門の業務に役立てること','ウ　ソフトウェアやハードウェアなどの各種リソースを、インターネットなどのネットワークを経由して、オンデマンドでスケーラブルに利用すること','エ　ネットワークを介して、複数台のコンピュータに処理を分散させ、処理結果を共有すること'],answer:2},
  {section:'ストラテジ系',q:'問6　インターネットに接続できる機能が搭載されており、車載センサで計測した情報をサーバへ送信し、そのサーバから運転に関する情報のフィードバックを受けて運転の支援などに活用することができる自動車を表す用語として、最も適切なものはどれか。',options:['ア　カーシェアリング','イ　カーナビゲーションシステム','ウ　コネクテッドカー','エ　電気自動車'],answer:2},
  {section:'ストラテジ系',q:'問7　著作権法によって保護の対象と成り得るものだけを、全て挙げたものはどれか。\n\na　インターネットに公開されたフリーソフトウェア\nb　データベースの操作マニュアル\nc　プログラム言語\nd　プログラムのアルゴリズム',options:['ア　a，b','イ　a，d','ウ　b，c','エ　c，d'],answer:0},
  {section:'ストラテジ系',q:'問8　画期的な製品やサービスが消費者に浸透するに当たり、イノベーションへの関心や活用の時期によって消費者をアーリーアダプタ、アーリーマジョリティ、イノベータ、ラガード、レイトマジョリティの五つのグループに分類することができる。このうち、活用の時期が2番目に早いグループとして位置付けられ、イノベーションの価値を自ら評価し、残る大半の消費者に影響を与えるグループはどれか。',options:['ア　アーリーアダプタ','イ　アーリーマジョリティ','ウ　イノベータ','エ　ラガード'],answer:0},
  {section:'ストラテジ系',q:'問9　不適切な行為a〜cのうち、不正競争防止法で規制されているものだけを全て挙げたものはどれか。\n\na　キャンペーンの応募者の個人情報を、応募者に無断で他の目的のために利用する行為\nb　他人のIDとパスワードを不正に入手し、それらを使用してインターネット経由でコンピュータにアクセスする行為\nc　不正な利益を得ようとして、他社の商品名や社名に類似したドメイン名を使用する行為',options:['ア　a','イ　a，c','ウ　b','エ　c'],answer:3},
  {section:'ストラテジ系',q:'問10　技術ロードマップの説明として、適切なものはどれか。',options:['ア　カーナビゲーションシステムなどに用いられている最短経路の探索機能の実現に必要な技術を示したもの','イ　業務システムの開発工程で用いるソフトウェア技術の一覧を示したもの','ウ　情報システム部門の人材が習得すべき技術をキャリアとともに示したもの','エ　対象とする分野において、実現が期待されている技術を時間軸とともに示したもの'],answer:3},
  {section:'ストラテジ系',q:'問11　RPA（Robotic Process Automation）の特徴として、最も適切なものはどれか。',options:['ア　新しく設計した部品を少ロットで試作するなど、工場での非定型的な作業に適している。','イ　同じ設計の部品を大量に製造するなど、工場での定型的な作業に適している。','ウ　システムエラー発生時に、状況に応じて実行する処理を選択するなど、PCで実施する非定型的な作業に適している。','エ　受注データの入力や更新など、PCで実施する定型的な作業に適している。'],answer:3},
  {section:'ストラテジ系',q:'問12　労働者派遣に関する記述a〜cのうち、適切なものだけを全て挙げたものはどれか。\n\na　派遣契約の種類によらず、派遣労働者の選任は派遣先が行う。\nb　派遣労働者であった者を、派遣元との雇用期間が終了後、派遣先が雇用してもよい。\nc　派遣労働者の給与を派遣先が支払う。',options:['ア　a','イ　a，b','ウ　b','エ　b，c'],answer:2},
  {section:'ストラテジ系',q:'問13　FinTechの事例として、最も適切なものはどれか。',options:['ア　銀行において、災害や大規模障害が発生した場合に勘定系システムが停止することがないように、バックアップシステムに切り替える。','イ　クレジットカード会社において、消費者が暗証番号を規定回数連続して誤入力した場合に、クレジットカードを利用できなくなるようにした。','ウ　証券会社において、顧客がPCの画面上で株式売買を行う際に、顧客に対して自動的に資産運用を提案するロボアドバイザのサービスを提供した。','エ　保険会社において、自動車の走行距離や運転習慣に応じて保険料が変わるテレマティクス保険の契約をインターネット上でできるようにした。'],answer:2},
  {section:'ストラテジ系',q:'問14　ソフトウェアライフサイクルを、企画プロセス、要件定義プロセス、開発プロセス、運用プロセスに分けるとき、利害関係者が必要とするシステムの機能や能力などを明確にし、システム要件として定義するプロセスはどれか。',options:['ア　企画プロセス','イ　要件定義プロセス','ウ　開発プロセス','エ　運用プロセス'],answer:1},
  {section:'ストラテジ系',q:'問15　A社の情報システム部門は、B社のソフトウェアパッケージを活用して、営業部門が利用する営業支援システムを構築することにした。構築に合わせて、EUC（End User Computing）を推進するとき、業務データの抽出や加工、統計資料の作成などの運用を行う組織として、最も適切なものはどれか。',options:['ア　A社の営業部門','イ　A社の情報システム部門','ウ　B社のソフトウェアパッケージ開発部門','エ　B社のソフトウェアパッケージ導入担当部門'],answer:0},
  {section:'ストラテジ系',q:'問16　マーチャンダイジングの説明として、適切なものはどれか。',options:['ア　消費者のニーズや欲求、購買動機などの基準によって全体市場をいくつかの小さな市場に区分し、標的とする市場を絞り込むこと','イ　製品の出庫から販売に至るまでの物の流れを統合的に捉え、物流チャネル全体を効果的に管理すること','ウ　店舗などにおいて、商品やサービスを購入者のニーズに合致するような形態で提供するために行う一連の活動のこと','エ　配送コストの削減と、消費者への接触頻度増加によるエリア密着性向上を狙って、同一エリア内に密度の高い店舗展開を行うこと'],answer:2},
  {section:'ストラテジ系',q:'問17　プロバイダが提供したサービスにおいて発生した事例a〜cのうち、プロバイダ責任制限法によって、プロバイダの対応責任の対象となり得るものだけを全て挙げたものはどれか。\n\na　氏名などの個人情報が電子掲示板に掲載されて、個人の権利が侵害された。\nb　受信した電子メールの添付ファイルによってマルウェアに感染させられた。\nc　無断で利用者IDとパスワードを使われて、ショッピングサイトにアクセスされた。',options:['ア　a','イ　a，b，c','ウ　a，c','エ　c'],answer:0},
  {section:'ストラテジ系',q:'問18　戦略目標の達成状況を評価する指標には、目標達成のための手段を評価する先行指標と目標達成度を評価する結果指標の二つがある。戦略目標が「新規顧客の開拓」であるとき、先行指標として適切なものはどれか。',options:['ア　売上高増加額','イ　新規契約獲得率','ウ　総顧客増加率','エ　見込み客訪問件数'],answer:3},
  {section:'ストラテジ系',q:'問19　ビッグデータの分析に関する記述として、最も適切なものはどれか。',options:['ア　大量のデータから未知の状況を予測するためには、統計的な分析手法に加え、機械学習を用いた分析を行うことができる。','イ　テキストデータ、動画データ、音楽データは、分析の対象として扱うことができない。','ウ　電子商取引のコメントやSNSの投稿データなど、Webサイトの画像データは人間の感情の分析などに活用できない。','エ　ブログの書き込みのような、分析のために意図して収集したわけではないデータは、分析の対象から除外される。'],answer:0},
  {section:'ストラテジ系',q:'問20　画像認識システムにおける機械学習の事例として、適切なものはどれか。',options:['ア　オフィスのドアの解錠に顔の画像による認証を加えることによって、セキュリティを強化した。','イ　様々な写真をコンピュータに大量に入力することで、コンピュータが自ら動物に対してその特性を識別できるようになった。','ウ　スマートフォンが自動的に、実行されている処理に関して通知を行うことで、ユーザーへの情報提供が行われるようになった。','エ　ヘッドフォンのノイズキャンセリング機能を設定することで、音楽の自動再生が可能になった。'],answer:1},
  {section:'ストラテジ系',q:'問21　ABC分析の事例として、適切なものはどれか。',options:['ア　顧客の消費行動を、時代、年齢、地区の三つの観点から分析する。','イ　自社の製品を、売上高の順に三つのグループに分類して分析する。','ウ　マーケティング活動を、顧客、製品、自社の三つの観点から分析する。','エ　リピート顧客を、購買頻度、購買金額などの観点から分析する。'],answer:1},
  {section:'ストラテジ系',q:'問22　業務パッケージを活用したシステム構築において、システムの全体計画を立案する企画プロセスで実施する事項として、最も適切なものはどれか。',options:['ア　機能、性能、信頼などの観点から業務パッケージを評価する。','イ　業務パッケージの標準機能では実現できない機能の追加開発が必要なシステム機能の範囲を決定する。','ウ　システム運用において発生した障害の対応を行う。','エ　定期的なシステム保守に関する計画を立案する。'],answer:0},
  {section:'ストラテジ系',q:'問23　プロダクトポートフォリオマネジメントは、企業の経営資源を最適配分するために使用する手法であり、製品やサービスの市場成長率と市場に占めるシェアから、その戦略的な位置付けを四つの領域に分類する。市場成長率が高く、かつ、市場シェアが低い位置付けのものはどれか。',options:['ア　金のなる木','イ　花形','ウ　負け犬','エ　問題児'],answer:3},
  {section:'ストラテジ系',q:'問24　テレワークに関する記述として、最も適切なものはどれか。',options:['ア　ITを活用した、場所や時間にとらわれない柔軟な働き方のこと','イ　企業の活動をいくつかの業務プロセスに分けて、それぞれを分担する組織形態のこと','ウ　個人が所有するPCやスマートデバイスなどの情報機器を、会社が許可した上でその業務に利用すること','エ　仕事の時間と私生活の時間の適切なバランスを維持するための計画を策定すること'],answer:0},
  {section:'ストラテジ系',q:'問25　暗号資産に関する記述として、最も適切なものはどれか。',options:['ア　暗号資産交換業の登録業者であっても、利用者の情報管理が不適切なケースがあるので、登録が無くても信頼できる業者を選ぶ。','イ　暗号資産の価格変動には制限が設けられているので、価値が急落したり、突然無価値になるリスクは考えなくてよい。','ウ　暗号資産の利用者は、暗号資産交換業者から契約の内容などの説明を受け、取引内容やリスク、手数料などについて把握しておくとよい。','エ　金融庁や財務局などの官公署は、安全性が優れた暗号資産の情報提供を行っているので、官公署の職員から勧められた暗号資産を主に取引する。'],answer:2},
  {section:'ストラテジ系',q:'問26　企業の人事機能の向上で、働き方改革を推進することを目的に、人事評価、人材育成などの人事関連業務に、AIやIoTといったITを活用する仕組みはどれか。',options:['ア　e-ラーニング','イ　FinTech','ウ　HRTech','エ　コンピテンシ'],answer:2},
  {section:'ストラテジ系',q:'問27　BYODの事例として、適切なものはどれか。',options:['ア　大手通信事業者から回線の卸売を受け、自社ブランドの通信サービスを開始した。','イ　ゴーグルを通してあたかも現実のような映像を見せることで、ゲーム世界の臨場感を高めた。','ウ　私物のスマートフォンから会社のサーバにアクセスして、電子メールやスケジューラを利用することができるようにした。','エ　図書館の本にICタグを付け、簡単に蔵書の管理ができるようにした。'],answer:2},

  {section:'ストラテジ系',q:'問30　情報の取扱いに関する不適切な行為a〜cのうち、不正アクセス禁止法で定められている禁止行為にあたるものだけを全て挙げたものはどれか。\n\na　オフィス内で拾得した書類に記載されていた他の社員のIDとパスワードを使用して、自社のサーバにネットワークを通じてログインした。\nb　顧客が暗証番号を規定回数連続して誤入力した場合に、クレジットカードを利用できなくなるようにシステムを設計した。\nc　部門の管理者に保管されていた人事評価情報が入ったUSBメモリを無断で自分のPCにコピーし、その情報を複数の関係者に送信した。',options:['ア　a','イ　b','ウ　a，b，c','エ　a，c'],answer:0},
  {section:'ストラテジ系',q:'問31　APIエコノミーに関する記述として、最も適切なものはどれか。',options:['ア　インターネットを通じて、様々な企業が提供するサービスを連携させて、より付加価値の高いサービスを提供する仕組み','イ　業界特有のインターネット技術によって、ソフトウェアのオープンソースを無償公開する仕組み','ウ　情報サービス会社が複数の処理機能を組み合わせてサービスを提供する仕組み','エ　企業が自社の業務システムのAPIを他社に有償で提供する仕組み'],answer:0},

  {section:'ストラテジ系',q:'問33　コンピュータシステム開発の外部への発注において、発注金額の確定後に請負契約を締結した。契約後、支払いまでに発注側と受注側の間で交わされる書類の組合せのうち、適切なものはどれか。ここで、契約内容の変更はないものとする。',options:['ア　提案書、納品書、検収書','イ　提案書、見積書、請求書','ウ　納品書、検収書、請求書','エ　見積書、納品書、請求書'],answer:2},
  {section:'ストラテジ系',q:'問34　SCMの導入による業務改善の事例として、最も適切なものはどれか。',options:['ア　インターネットで商品を購入できるようにしたので、販売チャネルの拡大による売上増が見込めるようになった。','イ　営業担当者がもっている営業情報や営業ノウハウをデータベースで管理するようにしたので、それらを営業部門全体で共有できるようになった。','ウ　ネットワークを利用して売上情報を製造元に伝達するようにしたので、製造元が製品をタイムリーに生産し、供給できるようになった。','エ　販売店の売上データを本部のサーバに集めるようにしたので、年齢別や性別の販売トレンドの分析ができるようになった。'],answer:2},
  {section:'ストラテジ系',q:'問35　ある製造業では、後工程から前工程への生産指示や、前工程から後工程への部品を引き渡す際の納品書として、部品の品番などを記録した電子式タグを用いる生産方式を採用している。ジャストインタイム生産方式の一つであるこのような生産方式として、最も適切なものはどれか。',options:['ア　かんばん方式','イ　クラフト生産方式','ウ　セル生産方式','エ　見込み生産方式'],answer:0},

  {section:'マネジメント系',q:'問37　システムの利用者数が当初の想定よりも増えてシステムのレスポンスが悪化したので、増強のためにサーバを1台追加することにした。動作テストが終わったサーバをシステムに組み入れて稼働させた。この作業を実施するITサービスマネジメントのプロセスとして、適切なものはどれか。',options:['ア　インシデント管理','イ　変更管理','ウ　問題管理','エ　リリース及び展開管理'],answer:3},
  {section:'マネジメント系',q:'問38　システム監査は、監査計画に基づき所定の手順によって実施しなければならない。システム監査の実施手順として適切なものはどれか。',options:['ア　監査計画に基づき：総合テスト、システムテスト、運用テストの順で実施','イ　監査計画に基づき：予備調査、本調査、評価・結論の順で実施','ウ　法令に基づき：総合テスト、システムテスト、運用テストの順で実施','エ　法令に基づき：予備調査、本調査、評価・結論の順で実施'],answer:1},
  {section:'マネジメント系',q:'問39　プロジェクトマネジメントのプロセスには、プロジェクトコストマネジメント、プロジェクトコミュニケーションマネジメント、プロジェクト資源マネジメント、プロジェクトスケジュールマネジメントなどがある。システム開発プロジェクトにおいて、テストを実施するメンバを選定するときのプロジェクト資源マネジメントの活動として、最も適切なものはどれか。',options:['ア　新規に参加するメンバに対して情報が適時に伝達されるよう、メーリングリストを整備する。','イ　新規に参加するメンバに対して、テストツールのトレーニングを計画する。','ウ　新規に参加するメンバへの人件費を予算として設定し、スケジュールを策定する。','エ　新規に参加するメンバのスキルや経験を確認し、適切な人材を選定・確保する。'],answer:3},

  {section:'マネジメント系',q:'問42　システム開発プロジェクトにおいて、完成したプログラムのテスト工程で品質管理を行うためのプロジェクトマネジメントとして、最も適切なものはどれか。',options:['ア　プロジェクト資源マネジメント','イ　プロジェクトスコープマネジメント','ウ　プロジェクト調達マネジメント','エ　プロジェクト品質マネジメント'],answer:3},

  {section:'マネジメント系',q:'問49　ITガバナンスに関する次の記述中の（ a ）に入れる、最も適切な字句はどれか。\n\n（ a ）は、現在及び将来のITの利用についての評価とIT利用が事業の目的に合致することを確実にする役割がある。',options:['ア　株主','イ　監査人','ウ　経営者','エ　情報システム責任者'],answer:2},
  {section:'マネジメント系',q:'問50　自分のデスクにあるPCと共有スペースにあるプリンタの起動を1人で行う。PCとプリンタの起動は次の条件で行い、それぞれの作業・処理は逐次実行する必要がある。自動処理の間は、移動やもう片方の作業を並行して行うことができる。自分のデスクにいる状態でPCの起動を開始し、移動してプリンタを起動した上で自分のデスクに戻り、PCの起動を終了するまでに必要な時間は、最短で何秒か。\n\n移動：片道60秒\nPCの起動：A 電源を入れる（3秒・手作業）→B ログイン画面起動処理（150秒・自動処理）→C ログイン操作（10秒・手作業）→D ログイン後のアプリケーション起動処理（60秒・自動処理）\nプリンタの起動：E 電源を入れる（3秒・手作業）→F 起動処理（60秒・自動処理）',options:['ア　223','イ　256','ウ　286','エ　406'],answer:0},
  {section:'マネジメント系',q:'問51　アジャイル開発を実施している事例として、最も適切なものはどれか。',options:['ア　AIシステムの予測精度を検証するために、開発に着手する前にトライアルを行い、有効なアルゴリズムを選択する。','イ　IoTの様々な技術を幅広く採用したいので、技術を保有するベンダに開発を委託する。','ウ　IoTを採用した大規模システムの開発を、上流から下流までの各工程における完了の承認を行いながら順番に進める。','エ　分析システムの開発において、分析の精度の向上を図るために、固定された短期間のサイクルを繰り返しながら分析プログラムの機能を順次追加する。'],answer:3},
  {section:'マネジメント系',q:'問52　自社の情報システムに関して、BCP（事業継続計画）に基づいて、マネジメントの視点から行う活動a〜dのうち、適切なものだけを全て挙げたものはどれか。\n\na　重要データのバックアップを定期的に取得する。\nb　非常時用の発電機と燃料を確保する。\nc　複数の通信網を確保する。\nd　復旧手順の訓練を実施する。',options:['ア　a，b，c','イ　a，b，c，d','ウ　a，d','エ　b，c，d'],answer:1},
  {section:'マネジメント系',q:'問53　ITサービスにおけるSLMに関する説明のうち、適切なものはどれか。',options:['ア　SLMでは、SLAで合意したサービスレベルを維持することが最優先課題となるので、サービスの品質の改善は補助的な活動となる。','イ　SLMでは、SLAで合意した定量的な目標の達成状況を確認するために、サービスの提供状況のモニタリングやレビューを行う。','ウ　SLMの目的は、顧客とサービスの内容、要求水準などの共通認識を得ることであり、SLAの作成が活動の最終目的である。','エ　SLMを効果的な活動にするために、SLAで合意するサービスレベルを容易に達成できるレベルにしておくことが重要である。'],answer:1},
  {section:'マネジメント系',q:'問54　WBSを作成するときに、作業の記述や完了基準などを記述した補助文書を作成する。この文書の目的として、適切なものはどれか。',options:['ア　WBSで定義した作業で使用するデータの意味を明確に定義する。','イ　WBSで定義した作業の進捗を管理する。','ウ　WBSで定義した作業のスケジュールのクリティカルパスを求める。','エ　WBSで定義した作業の内容と意味を明確に定義する。'],answer:3},
  {section:'マネジメント系',q:'問55　有料のメールサービスを提供している企業において、メールサービスに関する開発・設備投資の費用対効果の効率性を対象にしてシステム監査を実施するとき、システム監査人が所属している組織として、最も適切なものはどれか。',options:['ア　社長直轄の品質保証部門','イ　メールサービスに必要な機器の調達を行う運用部門','ウ　メールサービスの機能の選定や費用対効果の評価を行う企画部門','エ　メールシステムの開発部門'],answer:0},

  {section:'テクノロジ系',q:'問58　サーバルームへの共連れによる不正入室を防ぐ物理的セキュリティ対策の例として、適切なものはどれか。',options:['ア　サークル型のセキュリティゲートを設置する。','イ　サーバの入ったラックを施錠する。','ウ　サーバルーム内にいる間は入室証を着用するルールとする。','エ　サーバルームの入り口に入退室管理簿を置いて記録させる。'],answer:0},
  {section:'テクノロジ系',q:'問59　AさんがPさん、Qさん及びRさんの3人に電子メールを送信した。Toの欄にはPさんのメールアドレスを、Ccの欄にはQさんのメールアドレスを、Bccの欄にはRさんのメールアドレスをそれぞれ指定した。電子メールを受け取った3人に関する記述として、適切なものはどれか。',options:['ア　PさんとQさんは、同じ内容のメールがRさんにも送信されていることを知ることができる。','イ　Pさんは、同じ内容のメールがQさんに送信されていることを知ることはできない。','ウ　Qさんは、同じ内容のメールがPさんにも送信されていることを知ることができる。','エ　Rさんは、同じ内容のメールがPさんとQさんに送信されていることを知ることはできない。'],answer:2},
  {section:'テクノロジ系',q:'問60　情報システムにおける二段階認証の説明として、適切なものはどれか。',options:['ア　画面に表示されているゆがんだ文字の画像や音声を認識して入力し、利用者IDとパスワードの組み合わせで認証を行う。','イ　サーバへの接続するときに、発行した電子証明書を利用して認証を行う。','ウ　利用者IDとパスワードの組み合わせで認証を行った後、別の認証方法でも認証を行う。','エ　利用者IDの入力後、N回以上のパスワード入力の失敗でアカウントをロックする方法を用いて認証を行う。'],answer:2},

var current = 0;
var score = 0;
var answers = new Array(questions.length).fill(null);
var shuffledOrders = [];
var labels = ['ア','イ','ウ','エ'];

function getSectionRange(section) {
  if (section === 'ストラテジ系') return '問1〜35';
  if (section === 'マネジメント系') return '問36〜55';
  return '問56〜100';
}

function render() {
  var q = questions[current];
  var isAnswered = answers[current] !== null;
  var pct = (current / questions.length * 100).toFixed(1);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = (current + 1) + ' / ' + questions.length;

  var html = '<div class="section-badge">' + q.section + '　' + getSectionRange(q.section) + '</div>';
  html += '<div class="question-card">';
  html += '<div class="question-num">第' + (current + 1) + '問</div>';
  html += '<div class="question-text">' + q.q.replace(/\n/g, '<br>') + '</div>';
  html += '<div class="options">';

  if (!shuffledOrders[current]) {
    var order = q.options.map(function(_, k) { return k; });
    for (var si = order.length - 1; si > 0; si--) {
      var sj = Math.floor(Math.random() * (si + 1));
      var stmp = order[si]; order[si] = order[sj]; order[sj] = stmp;
    }
    shuffledOrders[current] = order;
  }
  var order = shuffledOrders[current];
  for (var i = 0; i < q.options.length; i++) {
    var origIdx = order[i];
    var cls = 'option-btn';
    if (isAnswered) {
      if (origIdx === q.answer) cls += ' reveal';
      else if (origIdx === answers[current] && answers[current] !== q.answer) cls += ' wrong';
    }
    var disabled = isAnswered ? 'disabled' : '';
    var optText = q.options[origIdx].replace(/^[アイウエ]　/, '');
    html += '<button class="' + cls + '" ' + disabled + ' onclick="selectAnswer(' + i + ')">' + labels[i] + '　' + optText + '</button>';
  }

  html += '</div>';

  if (isAnswered) {
    var correct = answers[current] === q.answer;
    html += '<div class="feedback ' + (correct ? 'correct' : 'wrong') + '" style="display:block">';
    html += correct ? '✅ 正解です！' : '❌ 不正解。正解は「' + q.options[q.answer] + '」です。';
    html += '</div>';
  }

  html += '</div>';

  html += '<div class="nav">';
  if (current > 0) {
    html += '<button class="btn btn-secondary" onclick="prevQuestion()">← 前の問題</button>';
  } else {
    html += '<span></span>';
  }
  if (isAnswered) {
    if (current < questions.length - 1) {
      html += '<button class="btn" onclick="nextQuestion()">次の問題 →</button>';
    } else {
      html += '<button class="btn" onclick="showScore()">結果を見る</button>';
    }
  } else {
    html += '<span></span>';
  }
  html += '</div>';

  document.getElementById('quizArea').innerHTML = html;
  window.scrollTo(0, 0);
}

function selectAnswer(idx) {
  if (answers[current] !== null) return;
  var origIdx = shuffledOrders[current][idx];
  answers[current] = origIdx;
  if (origIdx === questions[current].answer) score++;
  render();
}

function nextQuestion() {
  if (current < questions.length - 1) {
    current++;
    render();
  }
}

function prevQuestion() {
  if (current > 0) {
    current--;
    render();
  }
}

function showScore() {
  document.getElementById('quizArea').classList.add('hidden');
  var s = score;
  var t = questions.length;
  var pct = Math.round(s / t * 100);

  var strat = 0, stratT = 0, mgmt = 0, mgmtT = 0, tech = 0, techT = 0;
  for (var i = 0; i < questions.length; i++) {
    var sec = questions[i].section;
    if (sec === 'ストラテジ系') { stratT++; if (answers[i] === questions[i].answer) strat++; }
    else if (sec === 'マネジメント系') { mgmtT++; if (answers[i] === questions[i].answer) mgmt++; }
    else { techT++; if (answers[i] === questions[i].answer) tech++; }
  }

  var html = '<div class="score-card">';
  html += '<div class="score-num">' + s + '<span style="font-size:0.5em;color:#555"> / ' + t + '</span></div>';
  html += '<div class="score-label">正解率 ' + pct + '%</div>';
  html += '<div class="score-detail">';
  html += 'ストラテジ系：' + strat + ' / ' + stratT + '<br>';
  html += 'マネジメント系：' + mgmt + ' / ' + mgmtT + '<br>';
  html += 'テクノロジ系：' + tech + ' / ' + techT;
  html += '</div>';
  html += '<br><button class="btn" onclick="location.reload()">もう一度</button>';
  html += '&nbsp;&nbsp;<button class="btn btn-secondary" onclick="location.href=\'index.html\'">トップへ</button>';
  html += '</div>';
  document.getElementById('scoreArea').innerHTML = html;
  document.getElementById('scoreArea').classList.remove('hidden');
  window.scrollTo(0, 0);
}

render();
</script>
</body>
</html>
